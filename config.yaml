# ==============================================================================
# Tactical SDR Mesh Network (TSM-Net SG) - Baseline Configuration
# Single Static Frequency Proof-of-Concept (Raspberry Pi 5 + Pluto+ SDR)
# ==============================================================================

sdr:
  # Connection URI to Pluto+ SDR
  # Default USB RNDIS: "ip:192.168.2.1"
  # Gigabit Ethernet on Pluto+: "ip:192.168.1.10" (or configured LAN IP)
  # Direct USB: "usb:x.y.z"
  uri: "ip:192.168.2.1"

  # Static Local Oscillator (LO) Frequency (No hopping, locked single band)
  # 915 MHz ISM: 915000000 | 433 MHz ISM: 433000000 | 868 MHz: 868000000
  center_freq: 915000000

  # Baseband Sample Rate and Analog Filter Bandwidth (Hz)
  # 1.0 MSps provides optimal oversampling for 125 kHz LoRa chirps
  sample_rate: 1000000
  bandwidth: 1000000

  # Hardware Gains
  # tx_gain: Attenuation in dB (-89 to 0 dB, where 0 is maximum output power ~+7 to +10 dBm)
  # rx_gain: Hardware amplification in dB (0 to 73 dB)
  # rx_gain_mode: "manual", "fast_attack", "slow_attack", or "hybrid"
  tx_gain: -10
  rx_gain: 55
  rx_gain_mode: "manual"

  # Pluto buffer size in samples (I/Q complex)
  buffer_size: 32768

lora:
  # Spreading Factor (7 to 12). SF7 gives highest data throughput and lowest airtime
  spreading_factor: 7

  # Modulation Bandwidth in Hz (125000, 250000, or 500000)
  bandwidth: 125000

  # Coding Rate: 1 = 4/5, 2 = 4/6, 3 = 4/7, 4 = 4/8
  code_rate: 1

  # Sync Word: 0x12 (private tactical mesh), 0x34 (public LoRaWAN)
  sync_word: 0x12

  # Enable LoRa PHY hardware payload CRC
  has_crc: true

  # Explicit header mode (contains payload length, code rate, and CRC flags)
  impl_header: false

  # Low Data Rate Optimization (1 = enabled, 0 = disabled). Auto-enabled if symbol duration > 16ms
  ldro: 0

network:
  # Virtual Layer 2 TAP interface bridged into batman-adv
  tap_device: "tap-radio"

  # batman-adv kernel interface
  bat_device: "bat0"

  # Mesh IP address for this node (change per node, e.g., 10.10.0.1/24, 10.10.0.2/24)
  node_ip: "10.10.0.1/24"

  # MTU Clamping: LoRa max physical payload is 255 bytes.
  # Clamping MTU to 180 bytes leaves ample headroom for Ethernet (14B) + BATMAN (32B) + Framing (8B).
  mtu: 180

  # Localhost UDP Socket PDU ports connecting Orchestrator <-> GNU Radio Bridge
  ipc_tx_port: 52001    # Orchestrator sends TX PDUs to GNU Radio on this port
  ipc_rx_port: 52002    # GNU Radio sends RX PDUs to Orchestrator on this port
